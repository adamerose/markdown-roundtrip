<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="16" fill="#fce7f3"/>
  <!-- Ears -->
  <ellipse cx="80" cy="40" rx="12" ry="40" fill="#e5e7eb"/>
  <ellipse cx="120" cy="40" rx="12" ry="40" fill="#e5e7eb"/>
  <ellipse cx="80" cy="40" rx="7" ry="32" fill="#fbcfe8"/>
  <ellipse cx="120" cy="40" rx="7" ry="32" fill="#fbcfe8"/>
  <!-- Head -->
  <ellipse cx="100" cy="105" rx="45" ry="42" fill="#e5e7eb"/>
  <!-- Eyes -->
  <circle cx="82" cy="95" r="6" fill="#fce7f3"/>
  <circle cx="118" cy="95" r="6" fill="#fce7f3"/>
  <circle cx="82" cy="96" r="3.5" fill="#ec4899"/>
  <circle cx="118" cy="96" r="3.5" fill="#ec4899"/>
  <!-- Nose -->
  <ellipse cx="100" cy="110" rx="5" ry="4" fill="#fbcfe8"/>
  <!-- Mouth -->
  <path d="M95,115 Q100,120 105,115" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- Whiskers -->
  <line x1="55" y1="108" x2="80" y2="112" stroke="#9ca3af" stroke-width="1"/>
  <line x1="55" y1="118" x2="80" y2="116" stroke="#9ca3af" stroke-width="1"/>
  <line x1="145" y1="108" x2="120" y2="112" stroke="#9ca3af" stroke-width="1"/>
  <line x1="145" y1="118" x2="120" y2="116" stroke="#9ca3af" stroke-width="1"/>
  <!-- Label -->
  <text x="100" y="170" text-anchor="middle" font-family="monospace" font-size="16" fill="#9d174d" font-weight="bold">rabbit.svg</text>
</svg>
