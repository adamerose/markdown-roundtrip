<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="16" fill="#dbeafe"/>
  <!-- Ears -->
  <ellipse cx="55" cy="65" rx="20" ry="35" fill="#92400e" transform="rotate(-15,55,65)"/>
  <ellipse cx="145" cy="65" rx="20" ry="35" fill="#92400e" transform="rotate(15,145,65)"/>
  <!-- Head -->
  <ellipse cx="100" cy="95" rx="50" ry="45" fill="#b45309"/>
  <!-- Muzzle -->
  <ellipse cx="100" cy="110" rx="30" ry="22" fill="#fde68a"/>
  <!-- Eyes -->
  <circle cx="78" cy="88" r="7" fill="#fef3c7"/>
  <circle cx="122" cy="88" r="7" fill="#fef3c7"/>
  <circle cx="78" cy="89" r="4" fill="#1e1e2e"/>
  <circle cx="122" cy="89" r="4" fill="#1e1e2e"/>
  <!-- Nose -->
  <ellipse cx="100" cy="105" rx="8" ry="6" fill="#1e1e2e"/>
  <!-- Mouth -->
  <path d="M92,115 Q100,125 108,115" fill="none" stroke="#1e1e2e" stroke-width="1.5"/>
  <!-- Tongue -->
  <ellipse cx="100" cy="123" rx="5" ry="7" fill="#ec4899"/>
  <!-- Label -->
  <text x="100" y="170" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e3a5f" font-weight="bold">dog.svg</text>
</svg>
